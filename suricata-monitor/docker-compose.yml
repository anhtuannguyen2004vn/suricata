services:
  monitor:
    build: .
    container_name: suricata-monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SURICATA_EVE: /logs/eve.json
      MONITOR_DB: /data/alerts.sqlite3
      MONITOR_BIND: 0.0.0.0
      MONITOR_PORT: 8080
    volumes:
      - /var/log/suricata:/logs:ro
      - ./models:/app/models:ro
      - suricata_monitor_data:/data
volumes:
  suricata_monitor_data:
